# ---------------------------------------------------------------------------
# Sheet-on-sheet interlayer PES scan (static corrugation-barrier map).
#
# Reuses the sheet-on-sheet geometry but replaces the sliding run with a cheap,
# static N x N lateral scan of the interlayer potential-energy surface over one
# surface unit cell. Run with:
#   FrictionSim2D run pes-sheet examples/pes_sheet_config.ini -o ./pes_output
# ---------------------------------------------------------------------------

# ----------------------- 2D Sheet ----------
[2D]
mat = h-MoS2
cif_path = examples/materials/h-MoS2.cif
pot_path = examples/potentials/sw/MoS2_wen.sw
pot_type = sw
# A few unit cells is enough and cheapest for a static PES. Keep x, y larger
# than twice the LJ cutoff (~24 A) to avoid periodic self-interaction.
x = 30 # length of sheet in Angstrom
y = 30 # width of sheet in Angstrom
layers = [2] # a frozen bottom layer + a rigid, laterally-scanned top layer
stack_type = AB # AB or AA
lat_c =  # interlayer spacing in Angstrom (blank = relax to equilibrium)

# ----------------------- General -----------
[general]
temp = 0 # unused by the static scan (no dynamics/thermostat)

# ----------------------- PES scan ----------
[pes]
grid_n = 12 # N for the N x N lateral grid over one surface unit cell
grid_n_refine = 20 # optional finer grid for a convergence check (blank to skip)
z_relax = true # relax the top layer's z at each grid point (relaxed PES)
