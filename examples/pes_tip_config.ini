# ---------------------------------------------------------------------------
# Tip-on-sheet (AFM) surface PES scan (static tip-felt corrugation map).
#
# Builds and indents the AFM tip + sheet + substrate stack to a low load exactly
# as the sliding sim (system.in -> load_<f>N.data), then replaces the slide with
# a static N x N lateral scan of the tip position, recording the total energy and
# the lateral force on the tip. Run with:
#   FrictionSim2D run pes-tip examples/pes_tip_config.ini -o ./pes_output
# ---------------------------------------------------------------------------

# ----------------------- 2D Sheet ----------
[2D]
mat = h-MoS2
cif_path = examples/materials/h-MoS2.cif
pot_path = examples/potentials/sw/MoS2_wen.sw
pot_type = sw
x = 60 # length of sheet in Angstrom (must comfortably exceed the tip contact)
y = 60 # width of sheet in Angstrom
layers = [1] # single sheet layer under the tip
stack_type = AB # AB or AA
lat_c =  # interlayer spacing in Angstrom (blank = relax to equilibrium)

# ----------------------- Tip ---------------
[tip]
mat = Si
amorph =  # crystalline tip
r = 25 # radius of AFM tip in Angstrom
pot_path = examples/potentials/sw/Si.sw
pot_type = sw
cif_path = examples/materials/Si.cif

# ----------------------- Substrate ---------
[sub]
mat = Si
amorph = a # amorphous substrate (required for non-finite-sheet AFM)
thickness = 12 # substrate thickness in Angstrom
pot_path = examples/potentials/sw/Si.sw
pot_type = sw
cif_path = examples/materials/Si.cif

# ----------------------- General -----------
[general]
temp = 300 # equilibration temperature for the indentation phase (system.in)
force = 2 # a single, low normal load in nN (corrugation is clearest before ploughing)
scan_speed = 2 # unused by the static scan; kept for AFM build compatibility
finite_sheet = false

# ----------------------- PES scan ----------
[pes]
grid_n = 12 # N for the N x N lateral grid over one surface unit cell
