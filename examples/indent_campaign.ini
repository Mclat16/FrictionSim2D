# Adhesion (indent: hold + pull-off retract) sweep over the full material set.
# Substrate-based (has [sub]); each expanded config routes to IndentSimulation.
# Loads loop IN-SCRIPT (outer_loop unset) -> one indent script per (material,layer)
# covering all loads = 155*2 = 310 scripts, not 1240. Generate:
#   FrictionSim2D run indent examples/indent_campaign.ini -o <out> --hpc-scripts
# then reduce with: FrictionSim2D postprocess indent <out>/simulation_* \
#   --out-dir outputs/poke_sims --data-dir data

[2D]
materials_list = examples/material_list.txt
mat = {mat}
cif_path = examples/materials/{mat}.cif
pot_path = examples/potentials/sw/sw_lammps/{mat}.sw
pot_type = sw
x = 60
y = 60
layers = [1, 2]
stack_type = AB
lat_c =

[tip]
mat = Si
amorph =
r = 25
dspring =
pot_path = examples/potentials/sw/Si.sw
pot_type = sw
cif_path = examples/materials/Si.cif

[sub]
mat = Si
amorph = a
thickness = 12
pot_path = examples/potentials/sw/Si.sw
pot_type = sw
cif_path = examples/materials/Si.cif

[general]
temp = 300
force = [5, 10, 20, 30]
scan_speed = 2
finite_sheet = false
