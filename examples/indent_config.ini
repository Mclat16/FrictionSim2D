# ---------------------------------------------------------------------------
# AFM indentation ("indent") — hold (penetration) + retract (pull-off) in one run.
#
# The standard AFM sim (tip + sheet + substrate) run only up to the load, then
# held and retracted: the aveforce indentation ramp (system.in) presses the tip to
# each target load; per load a short DAMPED finite-T hold records the out-of-plane
# penetration channels (tip_z − sheet_com_z, the vertical compliance the lateral
# PES cannot see), then the rigid tip is frozen and RETRACTED quasi-statically
# (T=0) to full detachment for the pull-off force / work of adhesion / contact
# stiffness. The sliding phase is never invoked. Run with:
#   FrictionSim2D run indent examples/indent_config.ini -o ./indent_output --hpc-scripts
# then:
#   FrictionSim2D postprocess indent ./indent_output/simulation_* \
#       --out-dir outputs/poke_sims --data-dir data
# ---------------------------------------------------------------------------

# ----------------------- 2D Sheet ----------
[2D]
mat = h-MoS2
cif_path = examples/materials/h-MoS2.cif
pot_path = examples/potentials/sw/MoS2_wen.sw
pot_type = sw
x = 60 # length of sheet in Angstrom (must comfortably exceed the tip contact)
y = 60 # width of sheet in Angstrom
layers = [1, 2] # indent on a monolayer and a bilayer
stack_type = AB # AB or AA
lat_c =  # interlayer spacing in Angstrom (blank = relax to equilibrium)

# ----------------------- Tip ---------------
[tip]
mat = Si
amorph =  # crystalline Si r25 tip (same as the campaign)
r = 25 # radius of AFM tip in Angstrom
dspring =  # blank -> auto viscous damping so the tip settles during the hold
pot_path = examples/potentials/sw/Si.sw
pot_type = sw
cif_path = examples/materials/Si.cif

# ----------------------- Substrate ---------
[sub]
mat = Si
amorph = a # amorphous substrate (required for non-finite-sheet AFM)
thickness = 12 # substrate thickness in Angstrom
pot_path = examples/potentials/sw/Si.sw
pot_type = sw
cif_path = examples/materials/Si.cif

# ----------------------- General -----------
[general]
temp = 300 # equilibration temperature for the indentation phase (system.in)
# {10, 30} nN are the required deployable 2-point anchor; adding {5, 20, 50}
# delivers the 9-point stiffness ceiling + load-resolved pull-off for ~nothing.
force = [5, 10, 20, 30, 50] # normal loads in nN
scan_angle = 0 # matches the deployable-unit labels
scan_speed = 2 # unused by the hold/retract; kept for AFM build compatibility
outer_loop = force # one HPC job per load (each reads the shared load_<f>N.data)
finite_sheet = false

# ----------------------- Indent ------------
[indent]
hold_steps = 10000 # 10 ps damped hold at the target load (~10 samples/condition)
z_step = 0.2 # retract increment per step in Angstrom (recipe: 0.1–0.2 Å)
n_steps = 100 # retract steps; n_steps × z_step = 20 Å total (past the adhesive tail)
seed = 20260710 # campaign base seed; a fresh per-(material, layer) seed is
                # derived from it and recorded in the manifest. NEVER reuse a
                # campaign seed (that reproduces the campaign contact trajectory).
