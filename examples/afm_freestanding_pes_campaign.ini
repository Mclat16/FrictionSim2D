# Freestanding tip-on-slab PES sweep over the full material set (155 materials).
# No [sub] section -> each expanded per-material config auto-selects the
# freestanding builder (self-supported N-layer slab, layer_1 fixed). Generate:
#   FrictionSim2D run pes-tip examples/afm_freestanding_pes_campaign.ini -o <out> --hpc-scripts
# then reduce with: FrictionSim2D postprocess pes-scan <out>/simulation_* --data-dir data

[2D]
materials_list = examples/material_list.txt
mat = {mat}
cif_path = examples/materials/{mat}.cif
pot_path = examples/potentials/sw/sw_lammps/{mat}.sw
pot_type = sw
x = 60   # >= ~2*tip_r (50) + scan travel + cutoff, so the tip clears its image
y = 60
layers = [4]
stack_type = AB
lat_c =

[tip]
mat = Si
amorph =
r = 25
pot_path = examples/potentials/sw/Si.sw
pot_type = sw
cif_path = examples/materials/Si.cif

# no [sub] section -> freestanding

[general]
temp = 300
force = 2
scan_speed = 2
finite_sheet = false

[pes]
grid_n = 12
tip_load = 5
eval_mode = minimize
