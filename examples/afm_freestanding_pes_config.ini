# Freestanding tip-on-slab surface PES scan (substrate-free).
# No [sub] section -> the pes-tip command auto-selects the freestanding builder:
# a self-supported 4-layer slab of the material (layer_1 fixed) replaces the
# amorphous substrate that otherwise dominates the tip PES with registry noise.
#   FrictionSim2D run pes-tip examples/afm_freestanding_pes_config.ini -o ./pes_output

[2D]
mat = h-MoS2
cif_path = examples/materials/h-MoS2.cif
pot_path = examples/potentials/sw/MoS2_wen.sw
pot_type = sw
x = 40
y = 40
layers = [4]        # >=2 required; layer_1 is the fixed anchor
stack_type = AB
lat_c =

[tip]
mat = Si
amorph =
r = 25
pot_path = examples/potentials/sw/Si.sw
pot_type = sw
cif_path = examples/materials/Si.cif

# NB: no [sub] section — that absence is what selects the freestanding slab.

[general]
temp = 300
force = 2
scan_speed = 2
finite_sheet = false

[pes]
grid_n = 12
tip_load = 5          # target normal load (nN) the contact gap calibrates to
eval_mode = minimize  # minimize | md
