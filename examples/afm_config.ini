# ------------------------------- USER INPUTS --------------------------------

# ----------------------- 2D Sheet ----------
[2D]
materials_list = run/material_list.txt
mat = {mat} # Material ID "mp-2815" MoS2 "mp-1634" MoSe2
cif_path = run/cif/{mat}.cif
x = 100 # length of sheet in nm
y = 100 # width of sheet in nm
layers = [1,2,3] # Number of layers, multiple inputs possible i.e. 1,2,3
pot_path = {mat}.sw #potential path
pot_type = sw
stack_type = AB # AB or AA
lat_c =  # lattice constant in Angstrom (default is 6)

# ----------------------- Tip ---------------
[tip]
mat = Si # Material ID 
amorph =  # Amorphous: a for True,  for False
r = 25 # radius of AFM tip in Angstrom
dspring = 1.6e-6 # spring damper
tip_x =  # optional explicit tip x-position in box coordinates
tip_y =  # optional explicit tip y-position in box coordinates
tip_x_offset = 0.0 # used only when tip_x is not set
tip_y_offset = 0.0 # used only when tip_y is not set
pot_path = Si.sw #potential path
pot_type = sw
cif_path = run/cif/Si.cif

# ----------------------- Substrate ---------
[sub]
mat = Si # Material ID 
amorph = a # Amorphous: 'a' for True, '' for False
thickness = 12 # thickness of substrate in nm
x = 140 # substrate length in nm (finite-sheet mode)
y = 140 # substrate width in nm (finite-sheet mode)
pot_path = Si.sw #potential path
pot_type = sw
cif_path = run/cif/Si.cif

# ----------------------- General -----------
[general]
temp = 300 # in K
find = 5 # in nN
force = [2,5,10,20,30,50,70,85,100] # in nN
scan_angle = [2,90,4,30] # Scan Angle [lower limit, upper limit, interval,force nN]
driving_spring = 50 # spring constant in N/m
scan_speed = 2 # AFM tip scan speed in m/s
finite_sheet = false # set true to use [sub] x/y finite-sheet geometry
# finite_sheet_afm_edge_mode = spring  # 'spring' or 'none'
# finite_sheet_edge_spring_k = 10.0   # eV/Å², spring constant for 'spring' mode


