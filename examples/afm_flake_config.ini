# ----------------------- AFM with a shaped flake between tip and sheet -------
# Same as afm_config.ini, plus a [flake] section. The flake is a finite,
# shaped 2D patch (triangle/square/hexagon) cut from its own material and
# placed between the AFM tip and the supported 2D sheet. During indentation
# the flake's corner atoms are tethered in the xy-plane (free in z) so the
# flake keeps its shape; the restraint is released for the sliding phase.

# ----------------------- 2D Sheet ----------
[2D]
mat = MoS2
cif_path = examples/materials/h-MoS2.cif
x = 100 # length of sheet in nm
y = 100 # width of sheet in nm
layers = [1] # Number of layers
pot_path = examples/potentials/sw/MoS2_wen.sw # potential path
pot_type = sw
stack_type = AB # AB or AA
lat_c =  # lattice constant in Angstrom (default is 6)

# ----------------------- Tip ---------------
[tip]
mat = Si
amorph =
r = 25 # radius of AFM tip in Angstrom
dspring = 1.6e-6 # spring damper
tip_x =
tip_y =
tip_x_offset = 0.0
tip_y_offset = 0.0
pot_path = examples/potentials/sw/Si.sw
pot_type = sw
cif_path = examples/materials/Si.cif

# ----------------------- Substrate ---------
[sub]
mat = Si
amorph = a # amorphous substrate (required when finite_sheet = false)
thickness = 12 # thickness of substrate in nm
x = 140
y = 140
pot_path = examples/potentials/sw/Si.sw
pot_type = sw
cif_path = examples/materials/Si.cif

# ----------------------- Flake -------------
[flake]
mat = MoS2 # flake material (its own CIF + potential)
cif_path = examples/materials/h-MoS2.cif
pot_path = examples/potentials/sw/MoS2_wen.sw
pot_type = sw
shape = hexagon # triangle | square | hexagon
edge_length = 30 # Å. triangle/square: side length; hexagon: circumradius
rotation_deg = 0.0 # in-plane rotation of the shape (degrees, CCW)
corner_radius = 5.0 # Å. capture radius around each vertex for corner atoms
corner_spring_k = 10.0 # eV/Å². xy tether stiffness during indentation
# x =        # optional carving supercell footprint (Å); auto-sized if blank
# y =
# center_x = # optional flake center override (box coords); defaults under tip
# center_y =

# ----------------------- General -----------
[general]
temp = 300 # in K
force = [5,20,50] # in nN
scan_angle = 0
driving_spring = 50
scan_speed = 2
finite_sheet = false
